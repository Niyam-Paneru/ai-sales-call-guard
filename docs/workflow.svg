<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1080" role="img" aria-labelledby="title desc">
  <title id="title">AI Sales Call Guard decision flow</title>
  <desc id="desc">Universal pre-transport blocks run before mode dispatch. Self-call and live-prospect modes have separate gates. Unknown modes and failed gates are denied with explicit reasons. The policy layer never places a call.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f3640"/>
    </marker>
    <style>
      .bg { fill:#fbfbf8; }
      .line { stroke:#2f3640; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
      .box { fill:#ffffff; stroke:#2f3640; stroke-width:2; rx:10; }
      .decision { fill:#ffffff; stroke:#2f3640; stroke-width:2; }
      .deny { fill:#fff7f6; stroke:#a33b32; stroke-width:2; rx:9; }
      .allow { fill:#f3f8f1; stroke:#416b43; stroke-width:2; rx:9; }
      .title { font:700 28px Arial, sans-serif; fill:#15191e; }
      .subtitle { font:15px Arial, sans-serif; fill:#5c6470; }
      .node { font:700 16px Arial, sans-serif; fill:#15191e; }
      .small { font:13px Arial, sans-serif; fill:#5c6470; }
      .reason { font:12px "Courier New", monospace; fill:#6f2f29; }
      .okreason { font:12px "Courier New", monospace; fill:#355b38; }
      .branch { font:700 12px Arial, sans-serif; fill:#5c6470; letter-spacing:.4px; }
      .note { font:13px Arial, sans-serif; fill:#4b535d; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1080"/>
  <text class="title" x="54" y="48">Call-mode governance before transport</text>
  <text class="subtitle" x="54" y="76">Universal blocks first → explicit mode branch → allow/deny with a reason</text>

  <!-- Request -->
  <rect class="box" x="40" y="118" width="230" height="72"/>
  <text class="node" x="155" y="148" text-anchor="middle">CallRequest</text>
  <text class="small" x="155" y="172" text-anchor="middle">mode + destination + policy state</text>

  <!-- Hard gates -->
  <rect class="box" x="320" y="105" width="270" height="98"/>
  <text class="node" x="455" y="136" text-anchor="middle">Universal hard gates</text>
  <text class="small" x="455" y="160" text-anchor="middle">contains_phi → on_dnc → daily cap</text>
  <text class="small" x="455" y="181" text-anchor="middle">first failure returns immediately</text>
  <path class="line" d="M250 154 H320"/>

  <!-- Blocked decision -->
  <path class="decision" d="M705 106 L790 154 L705 202 L620 154 Z"/>
  <text class="node" x="705" y="149" text-anchor="middle">blocked?</text>
  <text class="small" x="705" y="170" text-anchor="middle">hard_gate()</text>
  <path class="line" d="M590 154 H620"/>

  <!-- Hard deny -->
  <rect class="deny" x="860" y="98" width="340" height="112"/>
  <text class="node" x="1030" y="128" text-anchor="middle">DENY before mode logic</text>
  <text class="reason" x="1030" y="153" text-anchor="middle">sales_call_contains_phi</text>
  <text class="reason" x="1030" y="174" text-anchor="middle">destination_is_suppressed</text>
  <text class="reason" x="1030" y="195" text-anchor="middle">daily_limit_reached</text>
  <path class="line" d="M790 154 H860"/>
  <text class="branch" x="815" y="143">YES</text>

  <!-- Mode decision -->
  <path class="decision" d="M705 267 L800 320 L705 373 L610 320 Z"/>
  <text class="node" x="705" y="315" text-anchor="middle">request.mode?</text>
  <text class="small" x="705" y="337" text-anchor="middle">default deny otherwise</text>
  <path class="line" d="M705 202 V267"/>
  <text class="branch" x="716" y="238">NO</text>

  <!-- Unknown mode -->
  <rect class="deny" x="930" y="278" width="270" height="84"/>
  <text class="node" x="1065" y="309" text-anchor="middle">DENY unknown mode</text>
  <text class="reason" x="1065" y="337" text-anchor="middle">unknown_call_mode</text>
  <path class="line" d="M800 320 H930"/>
  <text class="branch" x="835" y="309">OTHER</text>

  <!-- Self-call lane -->
  <text class="branch" x="380" y="350" text-anchor="middle">SELF_CALL</text>
  <path class="line" d="M610 320 H380 V398"/>

  <path class="decision" d="M380 398 L472 448 L380 498 L288 448 Z"/>
  <text class="node" x="380" y="443" text-anchor="middle">self calls</text>
  <text class="node" x="380" y="463" text-anchor="middle">enabled?</text>

  <rect class="deny" x="30" y="412" width="240" height="72"/>
  <text class="node" x="150" y="439" text-anchor="middle">DENY</text>
  <text class="reason" x="150" y="465" text-anchor="middle">self_calls_disabled</text>
  <path class="line" d="M288 448 H270"/>
  <text class="branch" x="274" y="436">NO</text>

  <path class="decision" d="M380 548 L484 603 L380 658 L276 603 Z"/>
  <text class="node" x="380" y="596" text-anchor="middle">destination in</text>
  <text class="node" x="380" y="617" text-anchor="middle">self allowlist?</text>
  <path class="line" d="M380 498 V548"/>
  <text class="branch" x="390" y="527">YES</text>

  <rect class="deny" x="12" y="567" width="253" height="76"/>
  <text class="node" x="138" y="594" text-anchor="middle">DENY</text>
  <text class="reason" x="138" y="620" style="font-size:11px" text-anchor="middle">self_destination_not_allowlisted</text>
  <path class="line" d="M276 603 H265"/>
  <text class="branch" x="266" y="591">NO</text>

  <rect class="allow" x="250" y="720" width="260" height="82"/>
  <text class="node" x="380" y="751" text-anchor="middle">ALLOW self-test request</text>
  <text class="okreason" x="380" y="780" text-anchor="middle">self_call_allowed</text>
  <path class="line" d="M380 658 V720"/>
  <text class="branch" x="390" y="692">YES</text>

  <!-- Live prospect lane -->
  <text class="branch" x="690" y="405">LIVE_PROSPECT</text>
  <path class="line" d="M705 373 V425"/>

  <path class="decision" d="M705 425 L800 475 L705 525 L610 475 Z"/>
  <text class="node" x="705" y="470" text-anchor="middle">calls_enabled?</text>

  <rect class="deny" x="850" y="439" width="330" height="72"/>
  <text class="node" x="1015" y="466" text-anchor="middle">DENY</text>
  <text class="reason" x="1015" y="492" text-anchor="middle">global_sales_calls_disabled</text>
  <path class="line" d="M800 475 H850"/>
  <text class="branch" x="812" y="463">NO</text>

  <path class="decision" d="M705 555 L810 610 L705 665 L600 610 Z"/>
  <text class="node" x="705" y="603" text-anchor="middle">live calls</text>
  <text class="node" x="705" y="624" text-anchor="middle">enabled?</text>
  <path class="line" d="M705 525 V555"/>
  <text class="branch" x="716" y="545">YES</text>

  <rect class="deny" x="850" y="574" width="330" height="72"/>
  <text class="node" x="1015" y="601" text-anchor="middle">DENY</text>
  <text class="reason" x="1015" y="627" text-anchor="middle">live_sales_calls_disabled</text>
  <path class="line" d="M810 610 H850"/>
  <text class="branch" x="820" y="598">NO</text>

  <path class="decision" d="M705 695 L825 755 L705 815 L585 755 Z"/>
  <text class="node" x="705" y="746" text-anchor="middle">policy input</text>
  <text class="node" x="705" y="768" text-anchor="middle">== "approved"?</text>
  <path class="line" d="M705 665 V695"/>
  <text class="branch" x="716" y="686">YES</text>

  <rect class="deny" x="850" y="719" width="330" height="72"/>
  <text class="node" x="1015" y="746" text-anchor="middle">DENY</text>
  <text class="reason" x="1015" y="772" text-anchor="middle">ai_cold_call_policy_not_approved</text>
  <path class="line" d="M825 755 H850"/>
  <text class="branch" x="831" y="743">NO</text>

  <path class="decision" d="M705 842 L810 895 L705 948 L600 895 Z"/>
  <text class="node" x="705" y="889" text-anchor="middle">disclosure</text>
  <text class="node" x="705" y="910" text-anchor="middle">enabled?</text>
  <path class="line" d="M705 815 V842"/>
  <text class="branch" x="716" y="834">YES</text>

  <rect class="deny" x="850" y="859" width="330" height="72"/>
  <text class="node" x="1015" y="886" text-anchor="middle">DENY</text>
  <text class="reason" x="1015" y="912" text-anchor="middle">ai_disclosure_missing</text>
  <path class="line" d="M810 895 H850"/>
  <text class="branch" x="820" y="883">NO</text>

  <rect class="allow" x="575" y="980" width="260" height="70"/>
  <text class="node" x="705" y="1007" text-anchor="middle">ALLOW external request</text>
  <text class="okreason" x="705" y="1033" text-anchor="middle">live_call_policy_satisfied</text>
  <path class="line" d="M705 948 V980"/>
  <text class="branch" x="716" y="969">YES</text>

  <!-- Boundary notes -->
  <text class="note" x="54" y="1065">Policy decision only — no call transport exists in this repository.</text>
  <text class="note" x="1220" y="1065" text-anchor="end">"approved" is an application policy input, not legal approval.</text>
</svg>
